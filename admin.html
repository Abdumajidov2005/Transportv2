<script>
// ─── CONFIRM MODAL ────────────────────────────────────
function confirmDelete(message, onConfirm) {
  var overlay = document.createElement("div");
  overlay.className = "fixed inset-0 z-[200] flex items-center justify-center bg-black/30 backdrop-blur-sm p-4";
  overlay.innerHTML =
    '<div class="bg-white rounded-2xl shadow-xl border border-gray-200 w-full max-w-sm p-6">' +
      '<div class="flex items-center gap-3 mb-4">' +
        '<div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center shrink-0">' +
          '<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>' +
        '</div>' +
        '<div>' +
          '<h4 class="font-heading font-bold text-gray-900 text-base">Тасдиқлаш</h4>' +
          '<p class="text-sm text-gray-500 mt-0.5">' + message + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="flex gap-3 mt-6">' +
        '<button id="confirmCancel" class="flex-1 bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl hover:bg-gray-200 transition-colors text-sm">Бекор</button>' +
        '<button id="confirmOk" class="flex-1 bg-red-500 text-white font-semibold py-2.5 rounded-xl hover:bg-red-600 transition-colors text-sm">Ўчириш</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(overlay);
  overlay.querySelector("#confirmCancel").addEventListener("click", function() { overlay.remove(); });
  overlay.querySelector("#confirmOk").addEventListener("click", function() { overlay.remove(); onConfirm(); });
  overlay.addEventListener("click", function(e) { if (e.target === overlay) overlay.remove(); });
}

// ─── TOAST ────────────────────────────────────────────
function toast(msg, type) {
  // type: 'success' | 'error' | 'info'
  var colors = {
    success: 'bg-green-500',
    error:   'bg-red-500',
    info:    'bg-blue-500'
  };
  var icons = {
    success: '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>',
    error:   '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>',
    info:    '<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>'
  };
  var bg = colors[type] || colors.info;
  var icon = icons[type] || icons.info;

  var el = document.createElement('div');
  el.className = 'pointer-events-auto flex items-center gap-3 ' + bg + ' text-white text-sm font-medium px-4 py-3 rounded-xl shadow-lg translate-y-4 opacity-0 transition-all duration-300 max-w-xs';
  el.innerHTML = icon + '<span>' + msg + '</span>';

  var container = document.getElementById('toastContainer');
  container.appendChild(el);

  // Animate in
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      el.classList.remove('translate-y-4', 'opacity-0');
    });
  });

  // Auto remove after 3s
  setTimeout(function() {
    el.classList.add('translate-y-4', 'opacity-0');
    setTimeout(function() { el.remove(); }, 300);
  }, 3000);
}

var API = "https://api.artrans.uz";
var tokens = JSON.parse(localStorage.getItem("artrans_tokens") || "null");

var INPUT = 'w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-900 placeholder-gray-400 focus:outline-none focus:border-accent';
var BTN = 'w-full bg-accent text-white font-semibold py-3 rounded-xl hover:bg-[#c73e54] transition-colors inline-flex items-center justify-center gap-2';

// ─── AUTH ─────────────────────────────────────────────
function getAccess() { return tokens ? tokens.access : null; }
function getRefresh() { return tokens ? tokens.refresh : null; }
function saveTokens(data) { tokens = data; localStorage.setItem("artrans_tokens", JSON.stringify(data)); }
function clearTokens() { tokens = null; localStorage.removeItem("artrans_tokens"); }
function authHeaders() { return { "Authorization": "Bearer " + getAccess(), "Content-Type": "application/json" }; }
function authHeadersMultipart() { return { "Authorization": "Bearer " + getAccess() }; }

async function refreshToken() {
  try {
    var res = await fetch(API + "/auth/refresh/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh: getRefresh() }) });
    if (!res.ok) throw new Error("Refresh failed");
    var data = await res.json();
    tokens.access = data.access;
    saveTokens(tokens);
    return true;
  } catch(e) { clearTokens(); showLogin(); return false; }
}

async function apiFetchAdmin(url, options) {
  if (!options) options = {};
  if (!options.headers) options.headers = authHeaders();
  var res = await fetch(API + url, options);
  if (res.status === 401) {
    var refreshed = await refreshToken();
    if (refreshed) { options.headers = authHeaders(); res = await fetch(API + url, options); }
    else return null;
  }
  return res;
}

async function doLogin() {
  var user = document.getElementById("loginUser").value.trim();
  var pass = document.getElementById("loginPass").value;
  var errEl = document.getElementById("loginError");
  errEl.classList.add("hidden");
  if (!user || !pass) { errEl.textContent = "Логин ва паролни киритинг"; errEl.classList.remove("hidden"); return; }
  try {
    var res = await fetch(API + "/auth/login/", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: user, password: pass }) });
    if (!res.ok) { var err = await res.json().catch(function() { return {}; }); errEl.textContent = err.detail || "Логин ёки парол нотўғри"; errEl.classList.remove("hidden"); return; }
    var data = await res.json();
    saveTokens(data);
    showAdmin();
  } catch(e) { errEl.textContent = "Серверга уланиб бўлмади"; errEl.classList.remove("hidden"); }
}

function doLogout() { clearTokens(); showLogin(); }

// ─── NAVIGATION ───────────────────────────────────────
function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("adminPanel").classList.add("hidden");
}

async function showAdmin() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");
  try {
    var res = await apiFetchAdmin("/auth/me/");
    if (res && res.ok) { var user = await res.json(); document.getElementById("userName").textContent = user.username || user.email || "Admin"; }
  } catch(e) {}
  showSection("orders");
}

function showSection(name) {
  document.querySelectorAll(".admin-section").forEach(function(el) { el.classList.add("hidden"); });
  document.getElementById("sec-" + name).classList.remove("hidden");
  document.querySelectorAll(".nav-btn").forEach(function(btn) { btn.classList.remove("active"); });
  var activeBtn = document.querySelector('[data-nav="' + name + '"]');
  if (activeBtn) activeBtn.classList.add("active");
  // Close sidebar on mobile after selection
  if (window.innerWidth < 768) closeSidebar();
  if (name === "orders") loadOrders();
  if (name === "vehicles") loadVehiclesAdmin();
  if (name === "categories") loadCategoriesAdmin();
  if (name === "services") loadServicesAdmin();
  if (name === "clients") loadClientsAdmin();
  if (name === "settings") loadSettingsAdmin();
}

async function loadOrders() {
  var container = document.getElementById("ordersTable");
  container.innerHTML = '<div class="p-8 text-center text-gray-400">Юкланмоқда...</div>';
  var res = await apiFetchAdmin("/orders/admin/");
  if (!res || !res.ok) { container.innerHTML = '<div class="p-8 text-center text-red-400">Хато юз берди</div>'; return; }
  var data = await res.json();
  var orders = data.results || data || [];
  if (orders.length === 0) { container.innerHTML = '<div class="p-8 text-center text-gray-400">Буюртмалар йўқ</div>'; return; }

  var rows = orders.map(function(o) {
    var statusClass = o.status === "completed" ? "text-green-600 bg-green-50" : o.status === "cancelled" ? "text-red-500 bg-red-50" : "text-yellow-600 bg-yellow-50";
    return '<tr ' + trClass() + '>' +
      td('#' + o.id) +
      tdBold(o.full_name || o.name || "-") +
      td(o.phone || o.phone_number || "-") +
      '<td class="p-4"><span class="' + statusClass + ' text-xs font-semibold px-2.5 py-1 rounded-full">' + (o.status || "new") + '</span></td>' +
      td(o.created_at ? new Date(o.created_at).toLocaleDateString() : "-") +

  container.innerHTML = makeTable(["ID","Исм","Телефон","Статус","Сана","Амаллар"], rows);

async function saveVehicle(e) {
  e.preventDefault();
  var form = e.target;
  var id = form.id.value;
  var fd = new FormData();
  fd.append("name", form.name.value);
  if (form.year.value) fd.append("year", form.year.value);
  if (form.seats.value) fd.append("seats", form.seats.value);
  if (form.price.value) fd.append("price", form.price.value);

function selectIcon(btn, iconClass) {
  // Remove active class from all buttons
  document.querySelectorAll('.icon-btn').forEach(function(b) {
    b.classList.remove('ring-2', 'ring-accent', 'bg-accent/10');
    b.classList.add('hover:bg-gray-100');
  });
  
  // Add active class to clicked button
  btn.classList.add('ring-2', 'ring-accent', 'bg-accent/10');
  btn.classList.remove('hover:bg-gray-100');
  
  // Update hidden input
  document.getElementById('iconInput').value = iconClass;
}

async function saveCategory(e) {
  e.preventDefault();
  var form = e.target;
  var id = form.id.value;
  var body = { name: form.name.value };
  if (form.slug.value) body.slug = form.slug.value;
  if (form.icon.value) body.icon = form.icon.value;
  if (form.order.value !== '') body.order = parseInt(form.order.value);

  try {
    var res = await apiFetchAdmin(
      id ? "/fleet/admin/categories/" + id + "/" : "/fleet/admin/categories/",
      { method: id ? "PUT" : "POST", headers: authHeaders(), body: JSON.stringify(body) }
    );
    if (!res || !res.ok) {
      var error = await res.json().catch(function() { return {}; });
      var errMsg = "";
      if (typeof error === "object") {
        errMsg = Object.entries(error).map(function(kv) {
          return kv[0] + ": " + (Array.isArray(kv[1]) ? kv[1].join(", ") : JSON.stringify(kv[1]));
        }).join(" | ");
      } else {
        errMsg = String(error);
      }
      toast("Хато: " + errMsg, "error");
      return;
    }
    toast(id ? "Категория янгиланди" : "Категория қўшилди", "success");
    closeModal();
    loadCategoriesAdmin();
  } catch(err) {
    toast("Серверга уланиб бўлмади", "error");
    console.error(err);
  }
}

    '<button type="submit" class="bg-accent text-white font-semibold px-8 py-3 rounded-xl hover:bg-[#c73e54] transition-colors">Сақлаш</button>' +
    '</form>';

  document.getElementById("settForm").addEventListener("submit", saveSettings);
}

async function saveSettings(e) {
  e.preventDefault();
  var form = e.target;
  var body = { phone: form.phone.value, email: form.email.value, address: form.address.value, telegram: form.telegram.value, instagram: form.instagram.value, facebook: form.facebook.value, working_hours: form.working_hours.value, description: form.description.value };
  var res = await apiFetchAdmin("/site-settings/admin/", { method: "PATCH", headers: authHeaders(), body: JSON.stringify(body) });
  if (res && res.ok) {
    toast("Созламалар сақланди", "success");
  } else {
    toast("Хато юз берди", "error");
  }
}

// ─── IMAGE PREVIEW ────────────────────────────────────
function previewImg(input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var wrap = document.getElementById("imgPreviewWrap");
    if (!wrap) return;

    // Remove placeholder if exists
    var placeholder = document.getElementById("imgPlaceholder");
    if (placeholder) placeholder.remove();

    // Update or create preview image
    var existing = document.getElementById("imgPreview");
    if (existing) {
      existing.src = e.target.result;
    } else {
      var img = document.createElement("img");
      img.id = "imgPreview";
      img.src = e.target.result;
      img.className = "w-full h-full object-cover absolute inset-0";
      // Insert before the file input
      wrap.insertBefore(img, wrap.querySelector('input[type="file"]'));

      // Add hover overlay
      var overlay = document.createElement("div");
      overlay.className = "absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity pointer-events-none";
      overlay.innerHTML = '<span class="text-white text-xs font-medium">Алмаштириш</span>';
      wrap.insertBefore(overlay, wrap.querySelector('input[type="file"]'));
    }

    // Show filename below
    var hint = wrap.parentElement.querySelector("p");
    if (hint) hint.textContent = "✓ " + input.files[0].name;
  };
  reader.readAsDataURL(input.files[0]);
}

// ─── SIDEBAR TOGGLE (mobile) ─────────────────────────
function toggleSidebar() {
  var sidebar = document.getElementById("sidebar");
  var overlay = document.getElementById("sidebarOverlay");
  var isOpen = !sidebar.classList.contains("-translate-x-full");
  if (isOpen) { closeSidebar(); } else {
    sidebar.classList.remove("-translate-x-full");
    overlay.classList.remove("hidden");
  }
}
function closeSidebar() {
  var sidebar = document.getElementById("sidebar");
  var overlay = document.getElementById("sidebarOverlay");
  sidebar.classList.add("-translate-x-full");
  overlay.classList.add("hidden");
}

if (tokens && tokens.access) { showAdmin(); } else { showLogin(); }

document.getElementById("loginPass").addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
document.getElementById("loginUser").addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
